services:
  syslog-forwarder:
    build: .
    image: wazuh-syslog-forwarder:4.14.2
    restart: unless-stopped
    ports:
      - "${SYSLOG_PORT:-5514}:514/udp"
      - "${SYSLOG_PORT:-5514}:514/tcp"
    volumes:
      - syslog_remote_logs:/var/log/remote
      - ${RSYSLOG_CONFIG_DIR:-./config/rsyslog.d}:/etc/rsyslog.d:ro
    extra_hosts:
      - "wazuh-manager:host-gateway"
    environment:
      - WAZUH_MANAGER
      - WAZUH_MANAGER_PORT
      - WAZUH_AGENT_NAME
      - WAZUH_AGENT_KEY

volumes:
  syslog_remote_logs:
