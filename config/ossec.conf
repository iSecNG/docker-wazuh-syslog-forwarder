<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_ADDR</address>
      <port>WAZUH_MANAGER_PORT_VAL</port>
      <protocol>WAZUH_PROTOCOL_VAL</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22</config-profile>
    <notify_time>WAZUH_KEEP_ALIVE_VAL</notify_time>
    <time-reconnect>WAZUH_TIME_RECONNECT_VAL</time-reconnect>
    <auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>WAZUH_REGISTRATION_SERVER_VAL</manager_address>
      <port>WAZUH_REGISTRATION_PORT_VAL</port>
      <agent_name>WAZUH_AGENT_NAME_VAL</agent_name>
      <groups>WAZUH_AGENT_GROUP_VAL</groups>
      <authorization_pass_path>/var/ossec/etc/enrollment-pass</authorization_pass_path>
      <server_ca_path>WAZUH_REGISTRATION_CA_VAL</server_ca_path>
      <agent_certificate_path>WAZUH_REGISTRATION_CERTIFICATE_VAL</agent_certificate_path>
      <agent_key_path>WAZUH_REGISTRATION_KEY_VAL</agent_key_path>
      <delay_after_enrollment>20</delay_after_enrollment>
    </enrollment>
  </client>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/remote/*/*</location>
  </localfile>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>
</ossec_config>
