<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_ADDR</address>
      <port>WAZUH_MANAGER_PORT_VAL</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>WAZUH_AGENT_NAME_VAL</agent_name>
      <port>1515</port>
      <delay_after_enrollment>20</delay_after_enrollment>
    </enrollment>
  </client>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/remote/*/*</location>
  </localfile>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>
</ossec_config>
